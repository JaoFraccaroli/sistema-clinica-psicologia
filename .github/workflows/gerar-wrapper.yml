# Workflow temporário: gera o Maven Wrapper com o próprio Maven e testa com ele
name: Gerar Maven Wrapper

on:
  push:
    branches: [wrapper]

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gerar mvnw e mvnw.cmd
        run: mvn -B -N wrapper:wrapper -Dtype=only-script -Dmaven=3.9.9
      - name: Testar o projeto usando o wrapper
        run: chmod +x mvnw && ./mvnw -B -v && ./mvnw -B test
      - name: Salvar os arquivos gerados na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mvnw mvnw.cmd .mvn
          git update-index --chmod=+x mvnw
          git commit -m "Adiciona Maven Wrapper (gerado com mvn wrapper:wrapper)"
          git push origin HEAD:wrapper
