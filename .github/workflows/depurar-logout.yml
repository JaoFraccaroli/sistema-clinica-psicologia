name: Depurar logout
on:
  push:
    branches: [depurar-logout]
jobs:
  fluxo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x mvnw && ./mvnw -B -q -DskipTests package
      - name: Subir a aplicação e simular o navegador
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8080/login && break; sleep 2; done
          J=cookies.txt
          echo "== GET /login"; curl -s -c $J -b $J http://localhost:8080/login -o login.html -w "%{http_code}\n"
          T=$(grep -o 'name="_csrf" type="hidden" value="[^"]*"' login.html | sed 's/.*value="//;s/"//')
          echo "== POST /login"; curl -s -c $J -b $J -o /dev/null -w "%{http_code} -> %{redirect_url}\n" -d "username=psicologa&password=psicologa123&_csrf=$T" http://localhost:8080/login
          echo "== GET /"; curl -s -c $J -b $J -o /dev/null -w "%{http_code} -> %{redirect_url}\n" http://localhost:8080/
          echo "== GET /clinico/pacientes"; curl -s -c $J -b $J http://localhost:8080/clinico/pacientes -o pac.html -w "%{http_code}\n"
          echo "-- formulário de sair na página:"; grep -A3 'logout' pac.html
          T2=$(grep -o 'name="_csrf" value="[^"]*"' pac.html | head -1 | sed 's/.*value="//;s/"//')
          echo "token na página: ${T2:-NENHUM}"
          echo "== POST /logout"; curl -s -c $J -b $J -o /dev/null -w "%{http_code} -> %{redirect_url}\n" -d "_csrf=$T2" http://localhost:8080/logout
          echo "== GET /login?logout"; curl -s -c $J -b $J "http://localhost:8080/login?logout" -o out.html -w "%{http_code}\n"; head -c 600 out.html; echo
          echo "== GET /logout"; curl -s -c $J -b $J http://localhost:8080/logout -o /dev/null -w "%{http_code} -> %{redirect_url}\n"
          echo "== GET /favicon.ico"; curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/favicon.ico
          echo "== log"; grep -iE "warn|error" app.log | tail -20
