name: Testes

on: [push, pull_request]

jobs:
  container:
    name: Container (Docker Compose + MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir e subir aplicação + MySQL
        run: docker compose up -d --build

      - name: Testes de fumaça no container
        run: set -o pipefail; bash scripts/teste_container.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs (se algo falhar)
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Derrubar
        if: always()
        run: docker compose down -v

  kubernetes:
    name: Kubernetes (cluster kind + MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar cluster Kubernetes local (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: clinica
          config: k8s/kind-config.yaml

      - name: Construir a imagem e carregar no cluster
        run: |
          docker build -t clinica:local .
          kind load docker-image clinica:local --name clinica

      - name: Aplicar os manifestos
        run: |
          kubectl apply -k k8s
          kubectl -n clinica rollout status statefulset/clinica-banco --timeout=300s
          kubectl -n clinica rollout status deployment/clinica-app --timeout=400s

      - name: Testes de fumaça no Kubernetes
        run: set -o pipefail; MODO=kubernetes bash scripts/teste_container.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico (se algo falhar)
        if: failure()
        run: |
          kubectl -n clinica get all,pvc -o wide
          kubectl -n clinica describe pods | tail -120
          kubectl -n clinica logs deployment/clinica-app --all-containers --tail=200 || true

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes (JUnit + Cucumber) e cobertura mínima (JaCoCo)
        run: mvn -B verify

      - name: Testes de mutação (PIT)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Resumo de qualidade
        if: always()
        run: python3 scripts/resumo_qualidade.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-qualidade
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
            target/relatorio-cucumber.html
          if-no-files-found: ignore

  # Confere que os testes também rodam nas versões novas do Java (como no VS Code)
  java-mais-novo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "25"]
    name: Testes no Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Testes (JUnit + Cucumber)
        run: mvn -B verify

  # Só publica se TODOS os testes passaram e o push foi na main
  publicar-imagem:
    name: Publicar imagem (ghcr.io) + varredura de segurança
    needs: [qualidade, java-mais-novo, container, kubernetes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Etiqueta curta do commit
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar (latest + commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jaofraccaroli/sistema-clinica-psicologia:latest
            ghcr.io/jaofraccaroli/sistema-clinica-psicologia:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sistema de clínica de psicologia (Spring Boot) - dados fictícios
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Varredura de vulnerabilidades (Trivy)
        run: |
          set -o pipefail
          {
            echo "## Varredura de segurança da imagem (Trivy)"
            echo
            echo "Vulnerabilidades conhecidas de severidade ALTA e CRÍTICA (só relatório; não bloqueia):"
            echo
            echo '```'
            docker run --rm aquasec/trivy:0.58.1 image --quiet --severity HIGH,CRITICAL \
              --ignore-unfixed --format table \
              ghcr.io/jaofraccaroli/sistema-clinica-psicologia:${{ steps.tag.outputs.tag }}
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Confere que a imagem PUBLICADA funciona: baixa do ghcr.io e roda os testes de fumaça
  testar-imagem-publicada:
    name: Testar a imagem publicada
    needs: publicar-imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Baixar a imagem do commit e subir com MySQL
        env:
          COMPOSE_FILE: docker-compose.ghcr.yml
          TAG: ${{ needs.publicar-imagem.outputs.tag }}
        run: docker compose up -d
      - name: Testes de fumaça
        env:
          COMPOSE_FILE: docker-compose.ghcr.yml
          TAG: ${{ needs.publicar-imagem.outputs.tag }}
        run: set -o pipefail; bash scripts/teste_container.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Derrubar
        if: always()
        env:
          COMPOSE_FILE: docker-compose.ghcr.yml
        run: docker compose down -v
