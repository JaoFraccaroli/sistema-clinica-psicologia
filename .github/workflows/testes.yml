name: Testes

on: [push, pull_request]

jobs:
  container:
    name: Container (Docker Compose + MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir e subir aplicação + MySQL
        run: docker compose up -d --build

      - name: Testes de fumaça no container
        run: bash scripts/teste_container.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs (se algo falhar)
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Derrubar
        if: always()
        run: docker compose down -v

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes (JUnit + Cucumber) e cobertura mínima (JaCoCo)
        run: mvn -B verify

      - name: Testes de mutação (PIT)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Resumo de qualidade
        if: always()
        run: python3 scripts/resumo_qualidade.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-qualidade
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
            target/relatorio-cucumber.html
          if-no-files-found: ignore

  # Confere que os testes também rodam nas versões novas do Java (como no VS Code)
  java-mais-novo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "25"]
    name: Testes no Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Testes (JUnit + Cucumber)
        run: mvn -B verify
