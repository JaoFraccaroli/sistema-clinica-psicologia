name: Testes

on: [push, pull_request]

jobs:
  container:
    name: Container (Docker Compose + MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir e subir aplicação + MySQL
        run: docker compose up -d --build

      - name: Testes de fumaça no container
        run: set -o pipefail; bash scripts/teste_container.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs (se algo falhar)
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Derrubar
        if: always()
        run: docker compose down -v

  kubernetes:
    name: Kubernetes (cluster kind + MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar cluster Kubernetes local (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: clinica
          config: k8s/kind-config.yaml

      - name: Construir a imagem e carregar no cluster
        run: |
          docker build -t clinica:local .
          kind load docker-image clinica:local --name clinica

      - name: Aplicar os manifestos
        run: |
          kubectl apply -k k8s
          kubectl -n clinica rollout status statefulset/clinica-banco --timeout=300s
          kubectl -n clinica rollout status deployment/clinica-app --timeout=400s

      - name: Testes de fumaça no Kubernetes
        run: set -o pipefail; MODO=kubernetes bash scripts/teste_container.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico (se algo falhar)
        if: failure()
        run: |
          kubectl -n clinica get all,pvc -o wide
          kubectl -n clinica describe pods | tail -120
          kubectl -n clinica logs deployment/clinica-app --all-containers --tail=200 || true

  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes (JUnit + Cucumber) e cobertura mínima (JaCoCo)
        run: mvn -B verify

      - name: Testes de mutação (PIT)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Resumo de qualidade
        if: always()
        run: python3 scripts/resumo_qualidade.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-qualidade
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
            target/relatorio-cucumber.html
          if-no-files-found: ignore

  # Confere que os testes também rodam nas versões novas do Java (como no VS Code)
  java-mais-novo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "25"]
    name: Testes no Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Testes (JUnit + Cucumber)
        run: mvn -B verify
