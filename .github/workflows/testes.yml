name: Testes

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Rodar testes (JUnit + Cucumber)
        run: mvn -B test
      - name: Publicar relatório do Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cucumber
          path: target/relatorio-cucumber.html
          if-no-files-found: ignore
