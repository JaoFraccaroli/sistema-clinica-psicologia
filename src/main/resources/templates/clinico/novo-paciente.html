<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Novo paciente')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('clinico')}"></nav>
<div class="container" style="max-width: 640px">
    <h1>Novo paciente</h1>
    <form th:action="@{/clinico/pacientes}" th:object="${paciente}" method="post" class="mt-3">
        <h5 class="mt-3">Dados do paciente</h5>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label for="dataNascimento" class="form-label">Data de nascimento</label>
            <input type="date" id="dataNascimento" th:field="*{dataNascimento}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" id="telefone" th:field="*{telefone}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" th:field="*{email}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <h5 class="mt-4">Dados de pagamento <small class="text-muted">(compartilhados com o financeiro)</small></h5>
        <div class="mb-3">
            <label for="nomePagador" class="form-label">Quem paga as sessões</label>
            <input type="text" id="nomePagador" th:field="*{nomePagador}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('nomePagador')}" th:errors="*{nomePagador}"></div>
        </div>
        <div class="mb-3">
            <label for="cpfPagador" class="form-label">CPF de quem paga</label>
            <input type="text" id="cpfPagador" th:field="*{cpfPagador}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="valorSessao" class="form-label">Valor da sessão (R$)</label>
            <input type="number" step="0.01" id="valorSessao" th:field="*{valorSessao}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('valorSessao')}" th:errors="*{valorSessao}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </form>
</div>
</body>
</html>
