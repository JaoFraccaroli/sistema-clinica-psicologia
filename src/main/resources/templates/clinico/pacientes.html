<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Pacientes')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('clinico')}"></nav>
<div class="container">
    <div th:replace="~{fragmentos :: mensagens}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1>Pacientes</h1>
        <a th:href="@{/clinico/pacientes/novo}" class="btn btn-primary">Novo paciente</a>
    </div>
    <table class="table table-striped mt-3">
        <thead>
        <tr><th>Código</th><th>Nome</th><th>Telefone</th><th>Pagador</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pacientes}">
            <td th:text="${p.codigo}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.telefone}"></td>
            <td th:text="${p.nomePagador}"></td>
            <td><a th:href="@{/clinico/pacientes/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Prontuário</a></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/financeiro/cobrancas}">Ver área financeira</a>
</div>
</body>
</html>
