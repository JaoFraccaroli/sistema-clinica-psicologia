<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Cobranças')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('financeiro')}"></nav>
<div class="container">
    <div th:replace="~{fragmentos :: mensagens}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1>Cobranças</h1>
        <div class="d-flex gap-2 align-items-center">
        <a th:href="@{/financeiro/cobrancas/exportar}" class="btn btn-outline-primary" data-testid="exportar">Exportar planilha</a>
        <a th:if="${podeEditar}" th:href="@{/financeiro/cobrancas/nova}" class="btn btn-success">Nova cobrança</a>
        <span th:unless="${podeEditar}" class="badge text-bg-secondary fs-6" data-testid="somente-leitura">Modo somente leitura</span>
        </div>
    </div>
    <p class="text-muted">Os pacientes aparecem apenas pelo código. Dados clínicos não ficam disponíveis nesta área.</p>
    <table class="table table-striped mt-3">
        <thead>
        <tr><th>Código do paciente</th><th>Pagador</th><th>CPF</th><th>Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cobrancas}">
            <td th:text="${c.codigoPaciente}"></td>
            <td th:text="${c.nomePagador}"></td>
            <td th:text="${c.cpfPagador}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(c.valor, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${#temporals.format(c.vencimento, 'dd/MM/yyyy')}"></td>
            <td th:with="situacao=${c.situacaoEm(hoje)}">
                <span class="badge" data-testid="situacao"
                      th:classappend="${situacao.name() == 'PAGA'} ? 'text-bg-success' : (${situacao.name() == 'ATRASADA'} ? 'text-bg-danger' : 'text-bg-warning')"
                      th:text="${situacao.descricao}">Pendente</span>
                <small class="text-danger" th:if="${situacao.name() == 'ATRASADA'}"
                       th:text="${c.diasEmAtraso(hoje)} + (${c.diasEmAtraso(hoje) == 1} ? ' dia' : ' dias')"></small>
            </td>
            <td>
                <form th:if="${podeEditar and c.status.name() == 'PENDENTE'}"
                      th:action="@{/financeiro/cobrancas/{id}/pagar(id=${c.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-success">Registrar pagamento</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:unless="${podeEditar}" th:href="@{/clinico/pacientes}">&larr; Voltar à área clínica</a>
</div>
</body>
</html>
