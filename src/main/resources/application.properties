spring.application.name=sistema-clinica

# Banco de dados (MySQL). Configure pelas variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Aceita datas no formato do campo datetime-local do HTML (ex.: 2026-11-05T14:30)
spring.mvc.format.date-time=iso
