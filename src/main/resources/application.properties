spring.application.name=sistema-clinica-psicologia

# Banco H2 salvo em arquivo (não precisa instalar nada): os dados ficam em
# dados/clinica.mv.db, dentro da pasta do projeto, e não somem ao reiniciar.
# Para começar do zero, pare a aplicação e apague a pasta "dados".
# Para usar MySQL, rode com o perfil "mysql" (veja application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./dados/clinica
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Datas no formato dos campos de data do HTML
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Senhas de demonstração (troque pelas variáveis de ambiente)
clinica.senha.psicologa=${SENHA_PSICOLOGA:psicologa123}
clinica.senha.financeiro=${SENHA_FINANCEIRO:financeiro123}
# Senha da paciente fictícia Ana (usuário PAC-DEMO0001)
clinica.senha.paciente-exemplo=${SENHA_PACIENTE_EXEMPLO:paciente123}

# Pacientes fictícios para demonstração
clinica.dados-exemplo=true
