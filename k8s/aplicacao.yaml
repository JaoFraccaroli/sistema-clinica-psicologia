# A aplicação Spring Boot. Se o pod cair, o Deployment cria outro sozinho.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica-app
spec:
  # 1 réplica: a sessão de login fica na memória do pod. Para 2+ réplicas seria
  # preciso guardar a sessão fora (ex.: Spring Session no MySQL ou Redis).
  replicas: 1
  selector:
    matchLabels:
      app: clinica-app
  template:
    metadata:
      labels:
        app: clinica-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      initContainers:
        # Espera o banco aceitar conexões antes de subir a aplicação
        - name: esperar-banco
          image: mysql:8.4
          command: ["sh", "-c", "until mysqladmin ping -h clinica-banco --silent; do echo 'esperando o MySQL...'; sleep 3; done"]
          securityContext:
            runAsUser: 999
      containers:
        - name: clinica
          image: clinica:local
          imagePullPolicy: IfNotPresent   # usa a imagem construída no seu PC (kind load)
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: DB_URL
              value: jdbc:mysql://clinica-banco:3306/clinica
            # Cria os pacientes fictícios na primeira vez (só se o banco estiver vazio)
            - name: SPRING_APPLICATION_JSON
              value: '{"clinica":{"dados-exemplo":true}}'
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          envFrom:
            - secretRef:
                name: clinica-segredos
          startupProbe:          # dá tempo para o Spring iniciar (até 5 min)
            httpGet: { path: /login, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:        # só recebe acessos quando responde
            httpGet: { path: /login, port: 8080 }
            periodSeconds: 10
          livenessProbe:         # se travar, o Kubernetes reinicia o container
            httpGet: { path: /login, port: 8080 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
# Expõe a aplicação na porta 30080 do nó; o kind repassa para localhost:8081 no seu PC
apiVersion: v1
kind: Service
metadata:
  name: clinica-app
spec:
  type: NodePort
  selector:
    app: clinica-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
